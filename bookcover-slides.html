const decks=[
{id:'join',ch:0,type:'qr',tag:'WELCOME · 접속 안내',title:'이야기의 얼굴을 만드는<br><em>디자인 길드에 오신 걸 환영해요!</em>',body:'QR을 찍고 오늘의 퀘스트에 접속하세요.<br>지금 보는 설명 슬라이드 앱으로 연결됩니다.',qr:'join',qrTitle:'설명 슬라이드 앱 접속',button:'퀘스트 시작하기',note:'프로젝터에 첫 화면을 띄웁니다. 학생들은 QR로 이 설명 앱에 접속할 수 있습니다. 화면은 자동 동기화되지 않으므로 강사가 다음 장의 번호를 안내해 주세요. 프롬프트 실습 QR은 18장, 패들렛 QR은 마지막 장에 따로 나옵니다.'},
{id:'welcome',ch:0,type:'hero',tag:'PROLOGUE · 새로운 의뢰',title:'내 이야기가<br><em>책 한 권이 된다면?</em>',body:'오늘 여러분은 북커버 디자이너.<br>AI 파트너와 함께, 내가 전하고 싶은 생각을<br>독자가 보고 싶은 표지로 바꿉니다.',note:'최근에 표지만 보고 집어 든 책이나 웹소설이 있는지 물어보세요. 그림 실력보다 무엇을 왜 보여 줄지 정하는 선택이 중요하다는 점을 안내합니다.'},
{id:'map',ch:0,type:'map',tag:'QUEST MAP · 오늘의 모험',title:'다섯 구역을 지나<br><em>나만의 표지를 완성해요.</em>',body:'미션은 함께 풀고, 작품에는 각자의 이야기를 담아요.',note:'설명과 교실 공동 퀴즈를 거친 뒤 학생용 앱에서 개별 실습합니다. XP는 강사 화면에서 함께 푸는 네 개 퀴즈의 도전 점수이며 학생별 평가나 순위가 아닙니다.'},
{id:'role',ch:1,type:'cards',tag:'QUEST 01 · 디자이너의 역할',title:'AI가 그릴 때,<br><em>디자이너는 무엇을 할까요?</em>',body:'책의 의미를 정하고 결과를 판단하는 사람이 필요해요.',cards:[['내가 결정할 것','누구에게 어떤 이야기를 전할지, 어떤 장면과 분위기를 쓸지 정합니다.','🧭'],['AI에게 부탁할 것','설명한 내용을 이미지로 만들고, 여러 시안을 비교할 수 있도록 돕게 합니다.','✦']],callout:'좋은 결과는 기획하고, 비교하고, 고르는 과정에서 나옵니다.',note:'AI가 항상 지시를 정확히 따르지는 않는다는 점을 말해 주세요. 수정 요청과 최종 검수까지 디자이너의 일입니다.'},
{id:'quiz-reader',ch:1,type:'quiz',tag:'MISSION 01 · 기획의 시작',title:'디자인 의뢰가 도착했습니다.',question:'「비교를 멈추고 나를 찾는 이야기」의 표지를 만들 때, 먼저 정할 것은?',choices:['유행하는 효과를 최대한 많이 넣기','누가 읽으며 어떤 감정을 느끼면 좋을지 정하기','아무 그림이나 만든 뒤 제목 맞추기'],answer:1,explain:'독자와 메시지를 정하면 이미지·색·그림체를 고를 이유가 생겨요. 같은 이야기라도 독자에 따라 표현은 달라집니다.',note:'학생들의 선택 이유를 먼저 들은 후 보기를 클릭해 확인합니다. 틀려도 감점하지 않고 다시 고를 수 있습니다.'},
{id:'elements',ch:1,type:'cards',tag:'DESIGN KIT · 네 가지 도구',title:'표지를 만드는<br><em>네 가지 디자인 도구</em>',body:'하나의 메시지를 네 요소가 함께 전달해요.',cards:[['타이포그래피','제목이 읽히는 크기와 글씨의 분위기','Aa'],['이미지와 상징','책 내용을 대표하는 인물·사물·풍경','◈'],['색감','독자가 느낄 감정과 분위기','◐'],['구도와 여백','무엇을 먼저 보고 어디에 머물지','▣']],note:'책 표지를 보여주며 네 요소를 찾아보게 합니다. 특정 색이나 구성에 정답을 고정하지 말고 내용과의 연결을 물어보세요.'},
{id:'compare',ch:1,type:'compare',tag:'DESIGN LAB · 표지 관찰',title:'같은 제목, 다른 배치.<br><em>무엇이 먼저 보이나요?</em>',body:'두 도식은 제목과 이미지 배치를 비교하기 위한 예시예요.',note:'왼쪽 도식은 제목이 작고 배경과의 대비가 약합니다. 오른쪽은 제목과 이미지 영역이 나뉩니다. 무조건 오른쪽만 좋다는 식보다 읽기 쉬운 이유를 구체적으로 설명하게 합니다.'},
{id:'quiz-space',ch:1,type:'quiz',tag:'MISSION 02 · 여백의 비밀',title:'비어 있는 곳에도 역할이 있어요.',question:'표지의 여백은 어떤 역할을 할까요?',choices:['제목과 중요한 이미지를 더 잘 보이게 한다','그림이 모자라 보이므로 반드시 채워야 한다','작가가 디자인을 끝내지 못했다는 뜻이다'],answer:0,explain:'여백은 시선을 정리하고 제목이 읽힐 공간을 만들어요. 꽉 찬 화면도 쓸 수 있지만 메시지와 가독성을 함께 확인해야 합니다.',note:'프로젝터에서 조금 떨어져 제목이 잘 보이는지 확인하는 간단한 활동으로 연결해 보세요.'},
{id:'topics',ch:2,type:'topics',tag:'QUEST 02 · 나의 이야기 찾기',title:'동화 말고도,<br><em>우리의 이야기는 무한해요.</em>',body:'카드를 눌러 이야기의 출발점을 만나 보세요. 내 주제로 바꿔도 좋아요.',note:'선택 카드는 발상 예시입니다. 교실에서 경험을 공개하기 어려운 학생은 가상의 이야기나 사물·풍경으로 바꿀 수 있다고 안내합니다.'},
{id:'story',ch:2,type:'story',tag:'STORY ITEM · 메시지 수집',title:'주제에 질문을 더하면<br><em>나만의 이야기가 돼요.</em>',body:'무슨 일이 일어나고, 무엇이 달라지나요?',note:'학생에게 주인공·상황·변화 중 한 가지씩 말하게 합니다. 지금 단계에서는 정답이나 문장 완성도를 평가하지 않습니다.'},
{id:'symbol',ch:2,type:'cards',tag:'SYMBOL ITEM · 상징 수집',title:'인물이 없어도<br><em>이야기를 보여 줄 수 있어요.</em>',body:'감정과 생각을 사물이나 풍경으로 바꿔 보세요.',cards:[['압박감과 경쟁','끝없이 이어지는 계단, 무거운 가방, 작은 문','↗'],['연결과 관계','이어지거나 끊어진 실, 나란한 의자, 다리','⌁'],['회복과 성장','갈라진 땅의 새싹, 새벽의 빛, 펼친 종이학','❋']],callout:'상징에는 하나의 정답이 없어요. 왜 골랐는지 설명할 수 있으면 됩니다.',note:'같은 사물이 반대 의미로도 읽힐 수 있습니다. 학생이 의도한 의미를 듣고 표지에서 그 뜻이 전달되는지 함께 이야기하세요.'},
{id:'styles',ch:2,type:'gallery',tag:'STYLE SHOP · 그림체 탐험',title:'그림체를 고르면<br><em>이야기의 목소리가 바뀌어요.</em>',body:'아래는 서로 다른 표현을 보여 주는 AI 생성 예시입니다.',note:'웹툰·종이 콜라주·판화·수채화의 선, 질감, 명암을 비교합니다. 특정 주제에는 특정 그림체만 가능하다고 제한하지 마세요. 이미지들은 실제 출간 도서가 아닌 수업용 생성 예시입니다.'},
{id:'mood',ch:2,type:'mood',tag:'COLOR LAB · 분위기 실험',title:'같은 제목도,<br><em>색과 빛에 따라 달라져요.</em>',body:'버튼을 눌러 분위기를 바꾸고, 떠오르는 장르를 말해 보세요.',note:'색과 빛이 바뀌는 도식 시연입니다. 색에 보편적인 정답이 있다는 인상을 주지 말고 개인의 느낌과 문화적 차이를 인정해 주세요.'},
{id:'formula',ch:3,type:'cards',tag:'QUEST 03 · 요청문 제작',title:'내 머릿속 장면을<br><em>AI가 이해하는 문장으로.</em>',body:'주제와 표현을 구체적으로 설명하는 글을 프롬프트라고 불러요.',cards:[['무엇을','핵심 이미지와 배경, 책의 내용','01'],['어떤 그림체로','웹툰·수채화·콜라주·사진형 등','02'],['어떻게 배치해','제목 자리, 구도, 빛의 방향','03'],['어떤 느낌으로','주요 색감, 질감, 빼고 싶은 요소','04']],callout:'먼저 전하고 싶은 메시지를 쓰고, 그 메시지에 맞춰 네 요소를 연결해요.',note:'네 요소는 생각 정리 도구이며 모든 요청문에 반드시 같은 순서로 쓸 필요는 없습니다. 여러 요구가 충돌하지 않게 조정하는 것이 중요합니다.'},
{id:'prompt',ch:3,type:'prompt',tag:'PROMPT SCROLL · 요청문 업그레이드',title:'“멋지게 그려 줘”보다<br><em>구체적인 선택이 필요해요.</em>',body:'누구를 위한 어떤 책인지, 시각적 선택의 이유를 담아요.',note:'강조한 부분이 메시지·그림체·구도·색감에 해당합니다. 예시를 그대로 따라 쓰기보다 학생 자신의 이야기와 상징으로 바꾸게 합니다.'},
{id:'quiz-prompt',ch:3,type:'quiz',tag:'MISSION 03 · 충돌하는 주문 찾기',title:'AI도 헷갈리는 주문이 있어요.',question:'“인물 없이 풍경만, 얼굴을 크게 클로즈업”이라는 요청은 어떻게 고칠까요?',choices:['설명 없이 더 멋지게 해 달라고 한다','두 요청을 모두 더 강하게 반복한다','풍경 중심과 인물 중심 중 의도에 맞는 한 가지를 정한다'],answer:2,explain:'서로 충돌하는 지시를 정리해야 해요. 풍경이 중심이면 얼굴 지시를 빼고, 인물이 중심이면 인물 없는 조건을 바꿉니다.',note:'“그림만 생성”과 “한글 제목을 크게 넣기”도 충돌할 수 있습니다. 선택한 제목 모드와 실제 요청문이 일치하는지 확인시켜 주세요.'},

{id:'practice',ch:3,type:'qr',tag:'MISSION START · 프롬프트 제작',title:'첫 번째 포털:<br><em>나만의 요청문 만들기</em>',body:'QR을 찍고 학생용 실습 앱으로 이동하세요.<br>책의 내용과 메시지를 먼저 쓰고,<br>내 선택을 담은 요청문을 완성해요.',qr:'student',qrTitle:'프롬프트 제작 앱 접속',note:'사용자가 제공한 첫 번째 QR 원본입니다. 이 QR은 기존 학생용 앱에 접속하기 위한 것입니다. 설명 앱의 기존 진행 화면은 그대로 유지한 채, 새 탭에서 실습을 안내하세요.'},
{id:'revise',ch:4,type:'cards',tag:'QUEST 04 · 수정의 기술',title:'첫 결과는 시안.<br><em>의도를 전하며 다듬어요.</em>',body:'“별로야”보다 유지할 것과 바꿀 것을 정확히 말해요.',cards:[['그대로 유지','“종이 콜라주 질감과 초록색 중심의 분위기는 유지해 줘.”','◈'],['부분만 수정','“새싹은 더 작게, 제목 공간은 위쪽에 넓게 비워 줘.”','✎']],callout:'예시 요청: “그림에 글자는 넣지 말고, 인물 없이 사물만 보여 줘.”',note:'제목의 한글 오류는 반복 생성만으로 해결되지 않을 수 있습니다. 그림만 만든 후 편집 도구에서 제목을 넣는 대안을 안내합니다. 인쇄할 때는 실제 규격과 잘리는 부분을 별도로 확인해 주세요.'},
{id:'quiz-quality',ch:4,type:'quiz',tag:'MISSION 04 · 최종 판단',title:'AI가 그렸으니 바로 완성일까요?',question:'가장 중요한 최종 확인은 무엇일까요?',choices:['내 메시지와 독자에게 맞고 제목이 읽히는지 확인하기','효과와 요소가 최대한 많은지 확인하기','AI가 처음 만든 결과를 무조건 선택하기'],answer:0,explain:'기획한 메시지가 전해지는지, 제목과 이미지가 읽히는지 사람이 확인해야 해요. 사용한 자료의 출처와 이용 조건도 함께 살펴봅니다.',note:'수업용 예시라도 기존 작품이나 로고를 그대로 가져온 경우 이용 조건을 확인하도록 안내합니다. 생성 이미지에는 틀린 글자나 비정상적인 형태가 있을 수 있습니다.'},
{id:'check',ch:4,type:'check',tag:'QUALITY GATE · 작품 점검',title:'갤러리로 가기 전,<br><em>다섯 가지를 확인해요.</em>',body:'프로젝터에서 함께 확인하거나 내 작품에 적용해 보세요.',note:'체크리스트는 이 설명 앱을 사용하는 기기에만 저장됩니다. 학생용 앱에서 작품을 검수하는 과정과 연결하되 자동 제출이나 점수 평가로 설명하지 마세요.'},
{id:'pitch',ch:4,type:'pitch',tag:'SHOWCASE · 디자이너 발표',title:'그림보다 먼저,<br><em>내 선택의 이유를 들려줘요.</em>',body:'아래 문장을 연결해 짧게 작품을 소개합니다.',note:'작품의 우열보다 메시지와 선택의 연결에 초점을 맞춥니다. 동료 피드백은 구체적인 관찰과 질문으로 남기도록 안내하세요.'},
{id:'ending',ch:4,type:'ending',tag:'QUEST CLEAR · 다음 이야기',title:'이야기의 얼굴을 만드는<br><em>첫 디자인 퀘스트 완료!</em>',body:'내가 고른 주제와 표현은, AI가 대신 결정할 수 없는 나의 선택입니다.',note:'마지막 장에서 패들렛 QR을 제시합니다. 다음 활동에서는 북커버 디자인뿐 아니라 편집 디자인·출판 기획·콘텐츠 아트디렉션 등 관련 역할로 확장할 수 있습니다.'},

const STORAGE='excitingedu.bookcover.quest.v1';
let state={slide:'join',answers:{},solved:[],checks:[],topic:0,mood:0};
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&typeof saved==='object'){if(decks.some(d=>d.id===saved.slide))state.slide=saved.slide;if(saved.answers&&typeof saved.answers==='object'&&!Array.isArray(saved.answers))state.answers=saved.answers;state.solved=Array.isArray(saved.solved)?[...new Set(saved.solved.filter(id=>decks.some(d=>d.id===id&&d.type==='quiz')))]:[];state.checks=Array.isArray(saved.checks)?saved.checks.filter(i=>Number.isInteger(i)&&i>=0&&i<5):[];state.topic=Number.isInteger(saved.topic)&&saved.topic>=0&&saved.topic<8?saved.topic:0;state.mood=Number.isInteger(saved.mood)&&saved.mood>=0&&saved.mood<3?saved.mood:0;}}catch{}
let index=Math.max(0,decks.findIndex(d=>d.id===state.slide));let toastTimer;
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch{}}
function qrPanel(which){const label=which==='join'?'설명 슬라이드 앱':which==='student'?'프롬프트 제작 앱':'패들렛 작품 갤러리';const href=which==='join'?URLS.slides:URLS[which];return `<div class="qr-panel"><strong>${label} 접속</strong><a href="${href}" target="_blank" rel="noopener noreferrer" aria-label="${label} 새 창 열기"><img src="${ASSETS[which]}" width="450" height="450" alt="${label} 접속 QR코드"></a><div class="qr-caption">카메라로 스캔하거나 QR을 눌러 접속하세요</div><div class="url">${href.replace('https://','')}</div></div>`;}
function heading(s){return `<h1 id="slide-title" tabindex="-1">${s.title}</h1>${s.body?`<p class="lead">${s.body}</p>`:''}`;}
function cards(s){return `<div class="cards ${s.cards.length===2?'two-cards':s.cards.length===3?'three-cards':''}">${s.cards.map((c,i)=>`<div class="card ${['lavender','mint','peach',''][i%4]}"><div class="n">DESIGN ITEM ${String(i+1).padStart(2,'0')}</div><span class="big" aria-hidden="true">${c[2]}</span><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>${s.callout?`<div class="callout">${s.callout}</div>`:''}`;}
const topics=[['학교와 성장','내 속도로 자라도 괜찮을까?','학교생활 속 비교와 경쟁을 겪는 주인공이 자신만의 속도를 찾아가는 이야기.'],['관계와 우정','서로 다른 우리가 친구가 될 수 있을까?','오해로 멀어진 친구가 대화를 통해 서로의 다름을 알아가는 이야기.'],['정체성과 감정','화면 속 나와 진짜 나는 같을까?','SNS 속 모습과 일상의 나 사이에서 자신이 원하는 모습을 찾아가는 이야기.'],['환경과 공존','내일의 지구에는 무엇이 남을까?','기후위기 속 동네의 작은 변화를 시작하는 청소년들의 이야기.'],['미래와 기술','AI와 함께 산다면 무엇이 달라질까?','AI가 추천하는 선택과 나만의 선택 사이에서 고민하는 미래 사회 이야기.'],['꿈과 진로','내 꿈을 꼭 지금 정해야 할까?','여러 일을 체험하면서 자신이 좋아하는 문제를 발견하는 이야기.'],['미스터리','아무도 없는 교실에 쪽지가 남았다.','학교에 남겨진 작은 단서들을 따라 사라진 기억을 찾는 이야기.'],['시와 에세이','말로 하지 못한 마음을 담는다면?','사소한 일상과 풍경을 통해 자신의 마음을 천천히 들여다보는 글.']];
const moodNames=['몽환적인 파스텔','따뜻한 낮의 빛','서늘한 밤의 빛'];
function body(s){switch(s.type){
case 'qr':return `<div class="two"><div class="intro-text"><span class="kicker">${s.qr==='join'?'ENTER THE DESIGN GUILD':s.qr==='student'?'PROMPT WORKSHOP':'ART GALLERY'}</span>${heading(s)}${s.button?`<button class="cta" data-action="advance">${s.button} →</button>`:''}<div class="pill-row"><span class="pill">${s.qr==='join'?'교실에서 함께하는 설명과 미션':s.qr==='student'?'기존 학생용 앱으로 연결':'완성한 이미지는 패들렛에서 게시'}</span></div></div>${qrPanel(s.qr)}</div>`;
case 'hero':return `<div class="two"><div>${heading(s)}<div class="pill-row"><span class="pill">나의 이야기</span><span class="pill">AI 파트너</span><span class="pill">표지 디자인</span></div><div class="callout">오늘의 의뢰: 내 메시지를 담은 북커버 한 장</div></div><div class="hero-wrap"><img src="${ASSETS.hero}" alt="밝은 창작 스튜디오에서 AI 로봇과 북커버를 디자인하는 청소년들"><div class="image-label">DESIGN GUILD · 창작 스튜디오</div></div></div>`;
case 'map':return heading(s)+`<div class="step-path">${[['◎','길드 입장','오늘의 의뢰 확인'],['◈','디자인 탐험','표지의 요소 발견'],['❋','아이디어 수집','주제와 상징 찾기'],['✎','요청문 제작','AI에게 의도 전달'],['✦','작품 완성','수정하고 전시하기']].map((v,i)=>`<button class="island" data-chapter="${i}"><b aria-hidden="true">${v[0]}</b><h3>${v[1]}</h3><p>${v[2]}</p></button>`).join('')}</div><div class="callout">함께 풀 도전 미션은 4개. 정답을 찾으면 각각 <strong>25 XP</strong>를 얻어요. 감점은 없어요.</div><p class="subtle">강사 화면의 교실 공통 도전 점수입니다. 학생별 평가나 실시간 집계가 아닙니다.</p>`;
case 'cards':return heading(s)+cards(s);
case 'quiz':return `<div class="quiz-heading">${heading(s)}<span class="reward">도전 보상 +25 XP</span></div><div class="quiz-area"><p class="question">${s.question}</p><div class="choices">${s.choices.map((v,i)=>`<button class="choice ${state.answers[s.id]===i?(i===s.answer?'correct':'wrong'):''}" data-answer="${i}" aria-pressed="${state.answers[s.id]===i}"><b>${String.fromCharCode(65+i)}</b><span>${v}</span></button>`).join('')}</div><div class="feedback" role="status">${Number.isInteger(state.answers[s.id])?(state.answers[s.id]===s.answer?`✓ 미션 성공! ${s.explain}`:'다시 생각해 볼까요? 의도한 메시지를 가장 잘 전달하는 선택을 찾아보세요.'):''}</div>${state.solved.includes(s.id)?'<p class="subtle">획득한 25 XP는 다시 방문해도 중복으로 더해지지 않아요.</p>':''}</div>`;
case 'compare':return heading(s)+`<div class="diagram-books"><div><div class="book busy"><strong>나의 속도로<br>걷는 중</strong><small>에세이 · 배치 예시 A</small></div><p class="book-label">A · 제목과 배경의 대비가 약함</p></div><span class="versus">VS</span><div><div class="book"><strong>나의 속도로<br>걷는 중</strong><small>에세이 · 배치 예시 B</small></div><p class="book-label">B · 제목과 이미지 영역을 나눔</p></div></div><div class="reveal"><button data-reveal="compare">관찰 포인트 보기</button></div><div id="compare-reveal" class="answer-note hidden">제목 크기와 대비, 이미지가 차지하는 면적, 여백을 비교해요. 멀리서도 제목이 읽히는지 확인해 보세요.</div>`;
case 'topics':return heading(s)+`<div class="cards topics">${topics.map((t,i)=>`<button class="topic" data-topic="${i}" aria-pressed="${state.topic===i}"><span>${t[0]}</span><small>${t[1]}</small></button>`).join('')}</div><div class="topic-result" role="status">${topics[state.topic][2]}</div>`;
case 'story':return `<div class="two"><div>${heading(s)}<div class="before">출발점: “학교생활에 관한 책”</div><div class="prompt-code">비교와 경쟁에 지친 학생이<br><mark>친구와 작은 정원을 가꾸며</mark><br>자신의 속도를 찾아가는 이야기.</div></div><div class="hero-wrap"><img src="${ASSETS.hero}" alt="다양한 이야기의 세계가 열려 있는 창작 스튜디오"><div class="image-label">주인공 · 상황 · 변화</div></div></div>`;
case 'gallery':return heading(s)+`<div class="gallery"><img src="${ASSETS.gallery}" alt="웹툰 미래 도시, 종이 콜라주 새싹, 흑백 판화 의자, 수채화 바다를 표현한 네 가지 표지 예시"></div><div class="gallery-labels"><div>웹툰 일러스트<small>선명한 선과 역동적인 장면</small></div><div>종이 콜라주<small>겹침과 종이의 질감</small></div><div>흑백 판화<small>강한 대비와 한 가지 강조색</small></div><div>수채화<small>번짐과 부드러운 색의 연결</small></div></div>`;
case 'mood':return heading(s)+`<div class="mood-showcase"><div class="mood ${['','day','night'][state.mood]}" aria-label="색과 빛이 바뀌는 표지 도식"><span class="moon"></span><p>내일을 걷는 마음</p></div><div class="mood-buttons">${moodNames.map((m,i)=>`<button data-mood="${i}" aria-pressed="${state.mood===i}">${state.mood===i?'●':'○'} ${m}</button>`).join('')}<p class="note-line">분위기 비교를 위한 색상 도식입니다.</p></div></div><div class="callout">어떤 색이 정답일까요? <strong>책이 전할 감정에 맞는 이유</strong>를 말해 보세요.</div>`;
case 'prompt':return heading(s)+`<div class="before">처음 요청: “성장에 관한 멋진 표지를 만들어 줘.”</div><div class="prompt-code"><mark>청소년이 자신의 속도를 찾아가는 이야기</mark>의 앞표지.<br>갈라진 땅에서 자라는 작은 새싹을 <mark>종이 콜라주</mark>로 표현해 줘.<br><mark>인물 없이 사물과 풍경 중심</mark>, 크림색과 초록색을 사용해 줘.<br><mark>상단에 제목을 넣을 넓은 여백</mark>을 남기고, 이미지에 글자는 넣지 마.</div><p class="subtle">이 예시는 그림을 먼저 만든 뒤 편집 도구에서 제목을 넣는 방식입니다.</p>`;
case 'check':return heading(s)+`<div class="checklist">${['책의 내용과 전하고 싶은 메시지가 드러나는가?','제목이 잘 읽히거나, 나중에 제목을 넣을 여백이 있는가?','핵심 이미지와 상징이 의도대로 보이는가?','색감과 그림체가 독자와 분위기에 어울리는가?','오류·불필요한 글자·원치 않는 요소를 확인했는가?'].map((t,i)=>`<label class="check-row"><input type="checkbox" data-check="${i}" ${state.checks.includes(i)?'checked':''}><span>${t}</span></label>`).join('')}</div><div class="check-summary" role="status">${state.checks.length}/5 항목 확인${state.checks.length===5?' · 갤러리로 갈 준비가 됐어요!':''}</div>`;
case 'pitch':return heading(s)+`<div class="prompt-code">제 책의 제목은 <mark>＿＿＿＿</mark>입니다.<br>이 책은 <mark>＿＿＿＿</mark>에게 전하고 싶은 이야기입니다.<br><mark>＿＿＿＿</mark>라는 마음을 보여 주려고<br><mark>＿＿＿＿</mark>라는 이미지와 색을 골랐습니다.</div><div class="cards two-cards"><div class="card mint"><h3>감상 피드백</h3><p>“이 부분에서 이런 느낌이 들어요.”<br>눈에 보이는 요소를 근거로 말해요.</p></div><div class="card lavender"><h3>디자이너에게 질문</h3><p>“이 상징을 고른 이유가 궁금해요.”<br>상대가 담은 의도를 들어 봐요.</p></div></div>`;
case 'ending':return `<div class="ending"><span class="trophy" aria-hidden="true">✦</span>${heading(s)}<div class="stat-row"><div class="stat"><strong>${state.solved.length*25} XP</strong><small>이 기기의 교실 공통 도전 점수</small></div><div class="stat"><strong>${state.solved.length}/4</strong><small>성공한 퀴즈 미션</small></div></div><div class="badge-collection"><span class="badge-item">기획하는 사람</span><span class="badge-item">의도를 전하는 사람</span><span class="badge-item">비교하고 고르는 사람</span></div><p class="subtle">다음 장에서 패들렛에 작품을 전시합니다.</p></div>`;
}}
function render(){const s=decks[index];state.slide=s.id;save();$('eyebrow').innerHTML='<i></i>'+s.tag;$('level').textContent='STAGE '+String(index+1).padStart(2,'0')+' / '+decks.length;$('slide').innerHTML=body(s);$('slide').classList.remove('slide');void $('slide').offsetWidth;$('slide').classList.add('slide');$('xp').textContent='✦ '+state.solved.length*25+' XP';$('teacher-note').textContent=s.note;$('count').textContent=(index+1)+' / '+decks.length+' · ← → 키로 이동';$('prev').disabled=index===0;$('next').disabled=index===decks.length-1;$('next').textContent=index===decks.length-1?'마지막 장':s.id==='join'?'퀘스트 시작 →':'다음 →';$('jump').value=s.id;$('chapters').innerHTML=chapters.map((ch,i)=>`<button data-chapter="${i}" class="${s.ch===i?'current':s.ch>i?'done':''}" ${s.ch===i?'aria-current="step"':''}>${ch.icon} ${ch.name}</button>`).join('');$('progress').setAttribute('aria-valuenow',index+1);$('progress').setAttribute('aria-valuemax',decks.length);$('progress').firstElementChild.style.width=((index+1)/decks.length*100)+'%';}
function go(id){const next=decks.findIndex(s=>s.id===id);if(next<0)return;index=next;render();window.scrollTo({top:0,behavior:'instant'});$('slide-title')?.focus({preventScroll:true});}
function advance(n){const i=index+n;if(i>=0&&i<decks.length)go(decks[i].id);}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2500);}
function celebrate(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<16;i++){const el=document.createElement('span');el.className='spark';el.style.left='50%';el.style.top='48%';el.style.background=['#8d78d9','#58ae95','#f1ba71'][i%3];el.style.setProperty('--dx',(Math.random()*500-250)+'px');el.style.setProperty('--dy',(Math.random()*420-210)+'px');document.body.append(el);setTimeout(()=>el.remove(),1050);}}
$('jump').innerHTML=decks.map((s,i)=>`<option value="${s.id}">${String(i+1).padStart(2,'0')} ${s.tag.split('·').pop().trim()}</option>`).join('');
$('prev').addEventListener('click',()=>advance(-1));$('next').addEventListener('click',()=>advance(1));$('jump').addEventListener('change',e=>go(e.target.value));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.chapter!==undefined){go(chapters[Number(b.dataset.chapter)].first);return;}if(b.dataset.action==='advance'){advance(1);return;}if(b.dataset.reveal){$(b.dataset.reveal+'-reveal').classList.toggle('hidden');b.setAttribute('aria-expanded',String(!$(b.dataset.reveal+'-reveal').classList.contains('hidden')));return;}if(b.dataset.topic!==undefined){state.topic=Number(b.dataset.topic);render();return;}if(b.dataset.mood!==undefined){state.mood=Number(b.dataset.mood);render();return;}if(b.dataset.answer!==undefined){const s=decks[index],a=Number(b.dataset.answer);state.answers[s.id]=a;if(a===s.answer&&!state.solved.includes(s.id)){state.solved.push(s.id);celebrate();toast('✦ 25 XP 획득! 의도를 설명해 보세요.');}render();}});
document.addEventListener('change',e=>{if(e.target.dataset.check!==undefined){const i=Number(e.target.dataset.check);state.checks=e.target.checked?[...new Set([...state.checks,i])]:state.checks.filter(v=>v!==i);save();document.querySelector('.check-summary').textContent=state.checks.length+'/5 항목 확인'+(state.checks.length===5?' · 갤러리로 갈 준비가 됐어요!':'');}});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,button,a,summary,dialog')||e.altKey||e.metaKey||e.ctrlKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();advance(1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();advance(-1);}if(e.key==='Home'){e.preventDefault();go(decks[0].id);}if(e.key==='End'){e.preventDefault();go(decks[decks.length-1].id);}});
$('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch{toast('전체화면을 사용할 수 없어요. 브라우저의 전체화면 메뉴를 이용해 주세요.');}});
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'⛶ 전체화면 해제':'⛶ 전체화면';});
$('reset').addEventListener('click',()=>$('reset-dialog').showModal());$('cancel-reset').addEventListener('click',()=>$('reset-dialog').close());$('confirm-reset').addEventListener('click',()=>{state={slide:'join',answers:{},solved:[],checks:[],topic:0,mood:0};$('reset-dialog').close();go('join');toast('새 수업을 시작합니다.');});
render();
</script></body></html>
